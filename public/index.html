<!DOCTYPE html>
<html>

    <head>
        <link rel="stylesheet" href="styles.css">
        <script
            src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
        <script
            src="https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore-compat.js"></script>
        <script
            src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
        <title>WeightTracker</title>
    </head>

    <body>

        <div id="loginContainer" class="card">
            <button id="googleLoginBtn" class="primary-btn">Mit Google anmelden</button>
        </div>

        <div id="appContainer" style="display:none;">
            <div class="input-row">
                <input type="text" id="weightInput" placeholder="Gewicht in kg">
                <input type="submit" value="EINGEBEN" onclick="addNewWeight()">
            </div>

            <div id="weightList"></div>

            <div class="actions-row">
                <button onclick="exportToCsv()" class="csv-btn">CSV EXPORT</button>
                <button id="logoutBtn" class="secondary-btn">Logout</button>
            </div>
        </div>

        <script src="firebase-config.js"></script>
        <script type="module" src="src/app.js"></script>
    </body>

</html>
